name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MinGW-w64 を入れる
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: テスト
        run: imgdupe/build.sh test
      - name: ビルド
        run: imgdupe/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: imgdupe-exe
          path: |
            imgdupe/out/imgdupe.exe
            imgdupe/out/imgdupe_setup.exe
      - name: 一時的な調査（CLIP のモデルの入出力）
        continue-on-error: true
        run: |
          pip install --quiet onnx
          python3 - <<'PY'
          import json, urllib.request, onnx
          def tree(repo):
              t = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}/tree/main?recursive=true", timeout=60))
              return [(e["path"], e.get("size")) for e in t if e.get("type") == "file"]
          def get(repo, path):
              return urllib.request.urlopen(f"https://huggingface.co/{repo}/resolve/main/{path}", timeout=600).read()
          def io(repo, path):
              m = onnx.load_from_string(get(repo, path))
              dims = lambda t: [d.dim_param or d.dim_value for d in t.type.tensor_type.shape.dim]
              print("  IO", path, "in:", [(i.name, i.type.tensor_type.elem_type, dims(i)) for i in m.graph.input if i.name not in {x.name for x in m.graph.initializer}],
                    "out:", [(o.name, dims(o)) for o in m.graph.output])
          r = "sentence-transformers/clip-ViT-B-32-multilingual-v1"
          for f in ["modules.json", "tokenizer_config.json", "special_tokens_map.json", "sentence_bert_config.json", "2_Dense/config.json", "1_Pooling/config.json"]:
              try: print("--", f, get(r, f).decode()[:600])
              except Exception as e: print("--", f, e)
          io(r, "onnx/model_quint8_avx2.onnx")
          print("--", "Dense header", get(r, "2_Dense/model.safetensors")[:200])
          r = "line-corporation/clip-japanese-base"
          for f in ["onnx/list.txt", "config.json", "tokenizer_config.json", "preprocessor_config.json"]:
              try: print("--", f, get(r, f).decode()[:900])
              except Exception as e: print("--", f, e)
          r = "Xenova/clip-vit-base-patch32"
          for f in ["preprocessor_config.json"]:
              print("--", f, get(r, f).decode()[:600])
          io(r, "onnx/vision_model_quantized.onnx")
          io(r, "onnx/vision_model_fp16.onnx")
          PY
