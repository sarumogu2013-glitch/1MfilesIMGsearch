name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MinGW-w64 を入れる
        # パッケージの置き場につながらないことがある（名前が引けないなど）ので、間を空けて 5 回までやり直す
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 g++-mingw-w64-x86-64-posix && exit 0
            echo "やり直す ($i)"; sleep $((i * 30))
          done
          exit 1
      - name: テスト
        run: imgdupe/build.sh test
      - name: ビルド
        run: imgdupe/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: imgdupe-exe
          path: |
            imgdupe/out/imgdupe.exe
            imgdupe/out/imgdupe_setup.exe
