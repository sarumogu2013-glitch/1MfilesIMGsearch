name: probe
on:
  push:
    branches: [claude/peaceful-bardeen-sgzgrh]
    paths: [.github/workflows/probe.yml]
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -o t.csv https://huggingface.co/SmilingWolf/wd-eva02-large-tagger-v3/resolve/main/selected_tags.csv
          wc -l t.csv; sha256sum t.csv
          gzip -9 -c t.csv | base64 -w 0 | fold -w 4000
          echo; echo END
