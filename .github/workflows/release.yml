name: release

on:
  push:
    branches: [main]
    paths: ['imgdupe/**', 'README.md', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

# 版の番号は既存のタグから決めるので、リリースは 1 つずつ順に作る
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 既存のタグからパッチ番号を決めるため
      - name: 版を決める
        run: |
          # VERSION（例: 1.0）と同じメジャー.マイナーのタグのうち、最大のパッチ + 1。無ければ 0
          BASE=$(tr -d ' \r\n' < imgdupe/VERSION)
          LAST=$(git tag -l "v$BASE.*" | sed "s/^v$BASE\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          TAG="v$BASE.$(( ${LAST:--1} + 1 ))"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "版: $TAG"
      - name: MinGW-w64 を入れる
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: テスト
        run: imgdupe/build.sh test
      - name: ビルド
        run: IMGDUPE_VERSION="$TAG" imgdupe/build.sh
      - name: AI の部品の一覧（models.json）を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          if ! python3 imgdupe/tools/make_models_json.py imgdupe/models.src.json dist "$GITHUB_REPOSITORY" "$TAG"; then
            # Hugging Face などに届かない時は、前のリリースの一覧をそのまま使う（ファイルの URL は前のリリースを指す）
            echo "::warning::models.json を作れなかったので、前のリリースのものを使います"
            gh release download --repo "$GITHUB_REPOSITORY" --pattern models.json --dir dist
          fi
      - name: リリースを作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp imgdupe/out/imgdupe.exe imgdupe/out/imgdupe_setup.exe dist/
          cd dist
          gh release create "$TAG" *.exe models.json $(ls *.dll 2>/dev/null) --target "$GITHUB_SHA" \
            --title "imgdupe $TAG" \
            --notes "imgdupe_setup.exe: インストーラー（管理者の権限は要りません。AI 解析の部品もここから入れられます）。
          imgdupe.exe: 実行ファイル単体（アプリの自動更新が使います）。
          models.json と *.dll: AI 解析の部品の一覧と ONNX Runtime（インストーラーとアプリがダウンロードします）。"
